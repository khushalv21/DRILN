name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install driln with dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check driln tests scripts

      - name: Ruff format check
        run: ruff format --check driln tests scripts

      - name: mypy (strict)
        run: mypy driln scripts

      - name: pytest
        run: PYTHONPATH=. pytest tests/ -v
